<head>

    <title>Reinigung Expert 300 - Pro</title>
    <style>
        :root {
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
            --accent: #10b981;
            --danger: #ef4444;
            --level-badge: #64748b;
        }
        body {
            margin: 0;
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        header {
            text-align: center;
            padding: 25px 20px;
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(10px);
            width: 100%;
            border-bottom: 1px solid #334155;
            box-sizing: border-box;
        }
        header h1 { margin: 0 0 10px 0; font-size: 1.8rem; color: #fff; }
        header p { margin: 0; color: #94a3b8; font-size: 0.95rem; }
        
        .container { width: 92%; max-width: 600px; margin-top: 30px; margin-bottom: 30px; }
        
        .card {
            background: var(--card);
            padding: 35px 25px;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            border: 1px solid #334155;
            position: relative;
        }
        
        .level-badge {
            position: absolute;
            top: 20px;
            right: 20px;
            background: var(--level-badge);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .word-display { 
            font-size: 2.2rem; 
            font-weight: 800; 
            color: #fff; 
            margin: 20px 0; 
            min-height: 3.5rem; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            text-shadow: 0 2px 10px rgba(59, 130, 246, 0.3);
        }
        .info { color: #94a3b8; margin-bottom: 20px; display: block; font-size: 1.1rem; letter-spacing: 1px; }
        
        .btn {
            width: 100%;
            padding: 16px;
            margin: 8px 0;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            font-size: 1.05rem;
            font-weight: 600;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn:active { transform: scale(0.98); }
        
        .btn-main { background: var(--primary); color: white; box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4); }
        .btn-main:hover { background: var(--primary-hover); }
        
        .btn-opt { background: #334155; color: #f1f5f9; border: 1px solid #475569; }
        .btn-opt:hover { background: #475569; }

        /* Yashil va Qizil animatsiyalar */
        .btn-correct { background: var(--accent) !important; color: white !important; border-color: var(--accent) !important; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4); }
        .btn-wrong { background: var(--danger) !important; color: white !important; border-color: var(--danger) !important; animation: shake 0.4s; }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }

        .hidden { display: none !important; }
        
        .progress-bar { width: 100%; height: 10px; background: #334155; border-radius: 5px; margin-bottom: 25px; overflow: hidden;}
        #fill { height: 100%; width: 0; background: linear-gradient(90deg, var(--primary), #60a5fa); border-radius: 5px; transition: width 0.4s ease; }
        
        input[type="text"] {
            width: 100%; padding: 18px; border-radius: 16px; border: 2px solid #475569;
            background: #0f172a; color: white; font-size: 1.2rem; box-sizing: border-box; margin-bottom: 20px;
            text-align: center; transition: all 0.3s ease; outline: none;
        }
        input[type="text"]:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.2); }
        .input-correct { border-color: var(--accent) !important; background: rgba(16, 185, 129, 0.1) !important; }
        .input-wrong { border-color: var(--danger) !important; background: rgba(239, 68, 68, 0.1) !important; animation: shake 0.4s; }
    </style>
</head>

let currentIdx = 0;
let mode = '';
let shuffleData = [];
let isAnswering = false; // Javob berilayotganda bloklash uchun

function start(m) {
    mode = m;
    shuffleData = [...data].sort(() => 0.5 - Math.random());
    currentIdx = 0;
    document.getElementById('menu').classList.add('hidden');
    document.getElementById('game').classList.remove('hidden');
    render();
}

function speak(t) {
    const s = window.speechSynthesis;
    const u = new SpeechSynthesisUtterance(t);
    u.lang = 'de-DE';
    s.speak(u);
}

function render() {
    isAnswering = false;
    if(currentIdx >= shuffleData.length) {
        document.getElementById('display').innerHTML = "<h2>🎉 G'alaba! 300 ta so'zni o'rgandingiz!</h2><p>Germaniyadagi ishingizda omad tilaymiz!</p>";
        document.getElementById('fill').style.width = "100%";
        return;
    }
    const item = shuffleData[currentIdx];
    const disp = document.getElementById('display');
    document.getElementById('fill').style.width = (currentIdx / data.length * 100) + "%";

    const badge = `<div class="level-badge">${item.lvl}</div>`;

    if(mode === 'quiz') {
        let opts = [item.uz];
        while(opts.length < 4) {
            let r = data[Math.floor(Math.random()*data.length)].uz;
            if(!opts.includes(r)) opts.push(r);
        }
        opts.sort(() => 0.5 - Math.random());
        disp.innerHTML = `
            ${badge}
            <span class="info">[ ${item.pr} ]</span>
            <div class="word-display">${item.de}</div>
            <button class="btn btn-opt" style="margin-bottom: 15px;" onclick="speak('${item.de}')">🔊 Eshitish</button>
            ${opts.map(o => `<button class="btn btn-opt quiz-btn" onclick="checkQ(this, '${o}', '${item.uz}')">${o}</button>`).join('')}
        `;
    } else if(mode === 'flash') {
        disp.innerHTML = `
            ${badge}
            <div class="word-display" id="w" style="margin-top:40px;">${item.de}</div>
            <span class="info">[ ${item.pr} ]</span>
            <button class="btn btn-main" onclick="document.getElementById('w').innerText='${item.uz}'">👁 TARJIMANI KO'RISH</button>
            <button class="btn btn-opt" onclick="speak('${item.de}')">🔊 Talaffuz</button>
            <button class="btn btn-correct" style="margin-top: 15px;" onclick="currentIdx++; render()">KEYINGISI ➔</button>
        `;
    } else if(mode === 'write') {
        disp.innerHTML = `
            ${badge}
            <div class="word-display" style="font-size:1.8rem; margin-top:30px;">${item.uz}</div>
            <input type="text" id="inp" placeholder="Nemischa yozing..." autocomplete="off" onkeypress="if(event.key==='Enter') checkW('${item.de}')">
            <button class="btn btn-main" onclick="checkW('${item.de}')">TEKSHIRISH</button>
            <button class="btn btn-opt" onclick="speak('${item.de}')">🔊 Eshitish</button>
        `;
        setTimeout(() => document.getElementById('inp').focus(), 100);
    }
}

function checkQ(btn, selected, correct) {
    if(isAnswering) return;
    isAnswering = true;
    
    const allBtns = document.querySelectorAll('.quiz-btn');
    
    if(selected === correct) {
        btn.classList.add('btn-correct');
        speak("Richtig"); // To'g'ri degan ma'noda (ixtiyoriy)
        setTimeout(() => { currentIdx++; render(); }, 800);
    } else {
        btn.classList.add('btn-wrong');
        // To'g'ri javobni ham yashil qilib ko'rsatamiz
        allBtns.forEach(b => {
            if(b.innerText === correct) b.classList.add('btn-correct');
        });
        setTimeout(() => { 
            btn.classList.remove('btn-wrong');
            isAnswering = false;
        }, 1200);
    }
}

function checkW(correct) {
    if(isAnswering) return;
    const inp = document.getElementById('inp');
    const v = inp.value.trim().toLowerCase();
    
    // Artiklni yozmasa ham yoki artikl bilan yozsa ham to'g'ri deb qabul qilish
    const coreDe = correct.toLowerCase().replace(/^(der|die|das)\s/, '');
    
    if(v === correct.toLowerCase() || v === coreDe) {
        isAnswering = true;
        inp.classList.remove('input-wrong');
        inp.classList.add('input-correct');
        setTimeout(() => { currentIdx++; render(); }, 800);
    } else {
        inp.classList.remove('input-correct');
        inp.classList.add('input-wrong');
        setTimeout(() => { inp.classList.remove('input-wrong'); }, 800);
    }
}
